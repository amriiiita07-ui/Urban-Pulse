kind = "web"
previewPath = "/"
title = "UrbanPulse Dashboard"
version = "1.0.0"
id = "artifacts/urbanpulse"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22702

[services.development]
run = "pnpm --filter @workspace/urbanpulse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/urbanpulse", "run", "build" ]
publicDir = "artifacts/urbanpulse/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22702"
BASE_PATH = "/"
